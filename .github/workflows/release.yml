name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.6.9"

      - name: Run ruff
        run: ruff check .
        continue-on-error: true

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.extras }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            extras: "dev"
          - os: macos-latest
            python-version: "3.13"
            extras: "dev"
          - os: windows-latest
            python-version: "3.10"
            extras: "dev"
          - os: windows-latest
            python-version: "3.13"
            extras: "dev,full"

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-cursor0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install package (editable) with extras [${{ matrix.extras }}]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Import smoke test
        run: python -c "import opennta; print('opennta', opennta.__version__)"

      - name: Run tests
        run: pytest

  release:
    name: build + publish GitHub Release
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel contains package data
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          (whl,) = glob.glob("dist/opennta-*.whl")
          required = {
              "opennta/application/main_window/logo.png",
          }
          with zipfile.ZipFile(whl) as zf:
              names = set(zf.namelist())
          missing = required - names
          if missing:
              sys.exit(f"wheel missing package data: {sorted(missing)}")
          print("wheel OK:", whl)
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

